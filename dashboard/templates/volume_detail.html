<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ image }} — Volume detail</title>
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">
  <link rel="stylesheet" href="/static/volume_inventory_redesign.css?v={{ static_version }}">
</head>
<body>
  {% include "_nav.html" %}
  <main class="page volume-detail-page" id="volume-detail-page" data-pool="{{ selected_pool }}" data-image="{{ image }}" data-is-admin="{{ 'true' if is_admin else 'false' }}">
    <header class="volume-detail-header">
      <div>
        <a class="volume-back-link" href="/volumes?pool={{ selected_pool }}{% if selected_cluster %}&cluster={{ selected_cluster.id }}{% endif %}">← Volumes</a>
        <div class="volumes-breadcrumb">Block Storage <span>›</span> Volumes <span>›</span> Detail</div>
        <h1 class="volume-detail-title" id="volume-detail-title">{{ image }}</h1>
        <p class="volume-detail-subtitle" id="volume-detail-id">Đang tải metadata…</p>
      </div>
      <span id="volume-detail-status" class="volume-detail-status"><i class="volume-status-dot"></i>Đang tải</span>
    </header>

    <section id="volume-detail-loading" class="volume-detail-card volume-detail-skeleton" aria-label="Đang tải chi tiết">
      <span class="skeleton skeleton-wide"></span><span class="skeleton skeleton-medium"></span>
      <span class="skeleton skeleton-wide"></span><span class="skeleton skeleton-wide"></span>
    </section>
    <div id="volume-detail-content" class="volume-detail-grid" hidden>
      <div>
        <section class="volume-detail-card">
          <h2>Thông tin volume</h2>
          <div class="volume-info-grid">
            <div class="volume-info-item"><span>ID</span><strong id="detail-image-id">—</strong></div>
            <div class="volume-info-item"><span>Size</span><strong id="detail-size">—</strong></div>
            <div class="volume-info-item"><span>Objects</span><strong id="detail-objects">—</strong></div>
            <div class="volume-info-item"><span>Format</span><strong id="detail-format">—</strong></div>
          </div>
        </section>
        <section class="volume-detail-card">
          <h2>Features</h2><div id="detail-features" class="volume-feature-list"></div>
        </section>
        <section class="volume-detail-card volume-attachment-card">
          <h2>Attachment status</h2><div id="detail-attachment" class="volume-attachment-grid"></div>
        </section>
        <section class="volume-detail-card">
          <div class="volume-tabs" role="tablist">
            <button class="volume-tab active" type="button" data-tab="snapshots">Snapshots</button>
            <button class="volume-tab" type="button" data-tab="watchers">Watchers</button>
            <button class="volume-tab" type="button" data-tab="locks">Locks</button>
            <button class="volume-tab" type="button" data-tab="children">Children / Clone</button>
          </div>
          <div id="detail-tab-snapshots" class="volume-tab-panel"></div>
          <div id="detail-tab-watchers" class="volume-tab-panel" hidden></div>
          <div id="detail-tab-locks" class="volume-tab-panel" hidden></div>
          <div id="detail-tab-children" class="volume-tab-panel" hidden></div>
        </section>
      </div>
      <aside class="volume-detail-card volume-actions-card" id="volume-detail-actions" {% if not is_admin %}hidden{% endif %}>
        <h2>Actions</h2>
        <form class="volume-action" id="volume-resize-form"><label for="volume-resize-size">Mở rộng volume (GiB)</label><div class="volume-action-row"><input id="volume-resize-size" type="number" min="1" max="65536" required placeholder="Dung lượng mới"><button class="btn btn-primary btn-sm" type="submit">Đề xuất</button></div></form>
        <form class="volume-action" id="volume-rename-form"><label for="volume-rename-name">Tên volume mới</label><div class="volume-action-row"><input id="volume-rename-name" maxlength="128" required placeholder="Tên mới"><button class="btn btn-primary btn-sm" type="submit">Đổi tên</button></div></form>
        <div class="volume-action"><button class="btn volume-action-danger" type="button" id="volume-trash-button">Chuyển vào Trash</button></div>
        <p id="volume-action-result" class="hint" hidden></p>
      </aside>
    </div>
    <p id="volume-detail-error" class="error" hidden></p>
  </main>
  <script src="/static/volume_detail.js?v={{ static_version }}"></script>
</body>
</html>

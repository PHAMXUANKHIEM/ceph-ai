    criticality: high
    tests: [tests/test_dashboard_nodes.py, tests/test_dashboard_pgs.py, tests/test_dashboard_pools.py, tests/test_dashboard_crush_map.py, tests/test_capacity_forecast.py]
  dashboard.block_storage:
    kind: route_group
    source: [dashboard/routes/block_storage.py, dashboard/routes/volumes.py, dashboard/cinder_discovery.py]

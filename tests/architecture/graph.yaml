    source: [shared/incident_outbox.py, shared/telegram_outbox.py]
    criticality: critical
    tests: [tests/test_incident_outbox.py, tests/test_incident_outbox_chaos.py, tests/test_telegram_outbox.py, tests/test_reliability_outbox.py]
    notes: Durable DB-backed dispatch/reconcile separates committed state from RabbitMQ/Telegram delivery.
  mq.incidents:
    kind: message_contract
    source: [shared/mq.py, watcher/publisher.py, worker/main.py]
    criticality: critical
    tests: [tests/test_publisher.py, tests/test_worker_main.py, tests/test_mq.py]

  watcher.ceph_client:
    kind: backend_client
    source: [watcher/ceph_client.py, dashboard/ceph_tools.py]
    criticality: critical
    tests: [tests/test_ceph_client.py, tests/test_ceph_tools.py]
  watcher.collectors:
    kind: collector
    source: [watcher/collector.py, watcher/*_monitor.py, watcher/node_metrics.py, watcher/capacity_forecast.py, watcher/capacity_evidence.py, watcher/log_intel.py, watcher/rgw_access_log.py, watcher/rgw_log.py]
    criticality: high
    tests: [tests/test_collector.py, tests/test_node_metrics.py, tests/test_volume_monitor.py, tests/test_capacity_forecast.py, tests/test_log_intel.py]
  watcher.main:
    kind: process
    source: [watcher/main.py]
    criticality: critical
    tests: [tests/test_watcher_main.py, tests/test_watcher_incident_flow.py]
  watcher.remediation:
    kind: process
    source: [watcher/remediation_main.py, watcher/verify.py]
    criticality: critical
    tests: [tests/test_remediation_watcher.py, tests/test_incident_verification.py]
  watcher.vitastor:
    kind: process
    source: [watcher/vitastor_monitor.py, vitastor/client.py]
    criticality: critical
    tests: [tests/test_vitastor_monitor.py, tests/test_vitastor_client.py, tests/test_vitastor_node_metrics.py]
  watcher.incident_publisher:
    kind: message_producer
    source: [watcher/publisher.py, watcher/main.py]
    criticality: critical
    tests: [tests/test_publisher.py, tests/test_watcher_incident_flow.py]

  worker.main:
    kind: process
    source: [worker/main.py]
    criticality: critical
    tests: [tests/test_worker_main.py]
  worker.diagnosis:
    kind: service
    source: [worker/llm/router_client.py, worker/llm/**, worker/code_repair.py]
    criticality: critical
    tests: [tests/test_router_client.py, tests/test_code_repair.py, tests/test_chat_client.py]
  worker.policy:
    kind: policy_boundary
    source: [worker/policy/**]
    criticality: critical
    tests: [tests/test_policy_gate.py, tests/test_playbook_registry.py, tests/test_operational_gate.py]
  worker.executor:
    kind: execution_boundary
    source: [worker/executor/**, worker/preflight.py]
    criticality: critical
    tests: [tests/test_commands.py, tests/test_ssh_executor.py, tests/test_rbd_reconciliation.py, tests/test_cinder_reconciliation.py]
  worker.backup:
    kind: workflow
    source: [worker/backup/**]
    criticality: critical
    tests: [tests/test_backup_engine.py, tests/test_backup_restore.py, tests/test_backup_scheduler.py, tests/test_backup_integrity_check.py, tests/test_restore_drill.py]
  worker.bucket_logging:
    kind: background_job
    source: [worker/bucket_logging.py]
    criticality: high
    tests: [tests/test_dashboard_bucket_access_log.py, tests/test_rgw_access_log.py]
  worker.rgw_audit:
    kind: background_job
    source: [worker/rgw_access_audit.py]
    criticality: high
    tests: [tests/test_rgw_access_audit.py]
  worker.delegated_tasks:
    kind: background_consumer
    source: [worker/delegated_tasks.py]
    criticality: high
    tests: [tests/test_delegated_tasks.py, tests/test_ai_delegation.py]
    notes: Separate delegated-AI queue and bounded consumer; not the incident queue.
  worker.federated_iam:
    kind: background_reconciliation
    source: [worker/federated_iam.py, worker/llm/router_client.py]
    criticality: high
    tests: [tests/test_federated_iam_worker.py]
    notes: OIDC RGW role mapping reconciliation is invoked from the approved-action poll path; LDAP/AD end-to-end reconciliation is not implemented.

  shared.directory_identity:
    kind: identity_adapter
    source: [shared/ldap_identity.py]
    criticality: high
    tests: [tests/test_ldap_identity.py]
    notes: LDAP/AD validation and group lookup; secret references may resolve from env/file/Vault.

  ai.shared_client:

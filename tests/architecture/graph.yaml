  dashboard.websocket:
    kind: realtime_transport
    source: [dashboard/ws.py, dashboard/static/app.js]
    criticality: high
    tests: [tests/test_dashboard_ws.py]
    notes: WebSocket checks DB Incident fingerprint; not a direct RabbitMQ subscription.
  dashboard.telegram_approval:
    kind: background_listener
    source: [dashboard/telegram_approval_bot.py, dashboard/telegram_chat.py]
    criticality: critical
    tests: [tests/test_telegram_approval_bot.py, tests/test_dashboard_chat.py]
    notes: Dashboard starts Telegram chat/approval listeners only when telegram_listener_enabled is true; long-poll is per distinct active token.

  data.sqlalchemy:
    kind: persistence
    source: [shared/db.py, shared/models.py, alembic/versions/*.py]
    criticality: critical
    tests: [tests/test_models.py, tests/test_migrations.py]
  data.request_observability:
    kind: cross_cutting_service
    source: [shared/request_context.py, shared/api_observability.py, shared/api_rate_limit.py, shared/security_audit.py, shared/logging_redaction.py]
    criticality: critical
    tests: [tests/test_dashboard_status.py, tests/test_redaction.py]
  data.ceph_query_cache:
    kind: cache
    source: [shared/ceph_query_cache.py]
    criticality: high
    tests: [tests/test_ceph_query_cache.py]
  data.object_storage_cache:
    kind: cache
    source: [shared/object_storage_cache.py]
    criticality: high
    tests: [tests/test_dashboard_object_storage.py, tests/test_dashboard_object_storage_users.py]
  data.audit:

# Architecture and regression impact graph.
# Keep node IDs stable. Update this graph and docs/architecture/overview.md in
# the same change whenever runtime ownership or a material flow changes.
schema_version: 1
snapshot:
  repository: PHAMXUANKHIEM/ceph-ai
  observed_at: 2026-09-28
  source_of_truth: code review of authoritative checkout at commit 567e071604d9571ce07c97a2551da30b673839eb
  notes:
    - Runtime relationships are manually reviewed; source paths are exact/glob patterns.
    - Process-local caches are not shared between Dashboard, Watcher and Worker.
    - A missing edge is not proof of no coupling; unknown/high-risk changes run the full non-live suite.

edge_kinds:
  - serves
  - starts
  - renders
  - calls
  - reads
  - writes
  - publishes
  - consumes
  - requires_auth
  - requires_product
  - requires_cluster_scope
  - requires_permission
  - executes
  - not_wired
  - covered_by
  - consumed_by
  - uses_transport
  - configured_when

nodes:
  browser.ceph_jinja:
    kind: frontend
    source: [dashboard/templates/*.html, dashboard/static/*.js]
    criticality: high
    tests: [tests/test_dashboard_navigation.py, tests/test_dashboard_health_api.py]
    notes: Jinja and page-specific JavaScript; some templates mount the Vite React bundle.
  browser.react:
    kind: frontend
    source: [ceph-health-dashboard/src/**, ceph-health-dashboard/vite.config.ts]
    criticality: high
    tests: []
    validation: [npm --prefix ceph-health-dashboard run build]
  browser.chat_widget:
    kind: frontend
    source: [dashboard/static/chat_widget.js, dashboard/templates/index.html, dashboard/templates/vitastor/index.html]
    criticality: high
    tests: [tests/test_dashboard_chat.py, tests/test_dashboard_vitastor_chat.py]

  config.runtime:
    kind: configuration
    source: [config/settings.py, shared/models.py, .env.example]
    criticality: critical
    tests: [tests/test_env_config.py, tests/test_clusters.py]
    notes: Global defaults plus per-cluster DB configuration; actual features vary by install.
  dashboard.app:

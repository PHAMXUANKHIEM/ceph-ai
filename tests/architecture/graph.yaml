    criticality: high
    tests: [tests/test_dashboard_telegram_alerts.py, tests/test_shared_telegram_alerts.py, tests/test_telegram_client.py]
  dashboard.cluster_lifecycle:
    kind: route_group
    source: [dashboard/routes/clusters.py, dashboard/routes/deploy_cluster.py, dashboard/routes/delete_cluster.py, dashboard/routes/convert_cluster.py, dashboard/routes/upgrade.py, dashboard/routes/patch.py]

deployment_variants:
  - id: ceph_execution_mode
    source: [config/settings.py, shared/models.py]
    values: [docker, podman, cephadm, none]
    changes_nodes: [watcher.ceph_client, watcher.collectors, worker.executor, dashboard.cluster_scope]
    note: Exact supported values and command paths must be verified per connector before release.
  - id: cluster_topology
    source: [shared/models.py, shared/clusters.py]
    values: [default_only, default_plus_active_secondary, inactive_secondary]
    changes_nodes: [dashboard.cluster_scope, watcher.main, watcher.remediation, worker.main]
  - id: object_storage
    condition: RGW nodes and/or S3 endpoint credentials are configured
    source: [config/settings.py, shared/models.py]
    changes_nodes: [dashboard.object_storage, dashboard.alerting, worker.bucket_logging, worker.rgw_audit, external.rgw_s3]
  - id: openstack_cinder
    condition: OpenStack controller connection/authentication is configured
    source: [config/settings.py, shared/models.py]
    changes_nodes: [dashboard.block_storage, dashboard.cinder_backups, worker.executor, external.openstack]
  - id: ai_provider
    condition: Provider enabled and usable credentials/endpoint configured
    source: [config/settings.py]
    changes_nodes: [dashboard.chat, dashboard.ai_ops, worker.diagnosis, ai.shared_client, external.ai_provider]
  - id: backup_target
    values: [unconfigured, ssh, s3, dual_target]
    source: [config/settings.py, worker/policy/backup_policy.yaml]
    changes_nodes: [dashboard.backup_restore, dashboard.cinder_backups, worker.backup, external.backup_targets]
  - id: log_intelligence_source
    values: [ssh, loki]
    source: [config/settings.py, watcher/log_source/**]
    changes_nodes: [dashboard.log_intelligence, watcher.collectors, external.logs]
  - id: telegram_channels
    condition: Per-channel enabled flag and token/chat credentials are configured
    source: [config/settings.py, shared/models.py]
    changes_nodes: [dashboard.alerting, dashboard.telegram_approval, watcher.main, worker.main, external.telegram]
  - id: vitastor_product
    condition: Vitastor product enabled and one or more active Vitastor clusters configured
    source: [config/settings.py, shared/models.py]
    changes_nodes: [dashboard.vitastor, watcher.vitastor, external.vitastor]
  - id: federated_identity
    condition: Configured identity provider (OIDC or LDAP/AD) and its required credentials/secret backend are present; execution capability depends on provider support.
    source: [dashboard/routes/federated_iam.py, config/settings.py, shared/models.py, shared/ldap_identity.py, worker/federated_iam.py]
    changes_nodes: [dashboard.federated_iam, shared.directory_identity, worker.federated_iam, external.identity_provider, external.vault_identity, external.rgw_s3]

coverage_rules:
  - id: rule.shared_security
    when_nodes: [dashboard.auth, dashboard.cluster_scope, worker.policy]
    include_flows: [flow.dashboard_read, flow.approval_execution, flow.object_storage, flow.vitastor_product]
    require_tests: [tests/test_dashboard_auth.py, tests/test_clusters.py, tests/test_policy_gate.py]
  - id: rule.persistence_schema
    when_nodes: [data.sqlalchemy, data.cluster_registry]
    include_flows: [flow.dashboard_read, flow.watcher_incident_diagnosis, flow.approval_execution, flow.backup_restore, flow.object_storage, flow.vitastor_product]
    require_tests: [tests/test_models.py, tests/test_migrations.py]
  - id: rule.incident_pipeline
    when_nodes: [watcher.main, watcher.remediation, watcher.incident_publisher, event.incident_queue, worker.main, worker.diagnosis]
    include_flows: [flow.watcher_incident_diagnosis, flow.approval_execution]
    require_tests: [tests/test_watcher_incident_flow.py, tests/test_worker_main.py, tests/test_publisher.py]
  - id: rule.execution_pipeline
    when_nodes: [dashboard.actions, worker.policy, worker.executor]
    include_flows: [flow.approval_execution, flow.backup_restore, flow.object_storage, flow.vitastor_product]
    require_tests: [tests/test_dashboard_actions.py, tests/test_policy_gate.py, tests/test_commands.py, tests/test_audit.py]
  - id: rule.frontend
    when_nodes: [browser.ceph_jinja, browser.react, browser.chat_widget]
    require_tests: [tests/test_dashboard_navigation.py]
    require_checks: [npm --prefix ceph-health-dashboard run build]
  - id: rule.configuration_variant
    when_nodes: [config.runtime]
    include_flows: [flow.dashboard_read, flow.watcher_incident_diagnosis, flow.approval_execution, flow.backup_restore, flow.object_storage, flow.vitastor_product]
    require_tests: [tests/test_env_config.py, tests/test_clusters.py]

fallback:
  unknown_source_path: full_non_live_suite
  critical_node_without_tests: full_non_live_suite_and_report_gap
  graph_parse_or_validation_error: fail_impact_selection_and_run_full_non_live_suite

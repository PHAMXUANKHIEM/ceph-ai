  dashboard.ai_ops:
    kind: route_group
    source: [dashboard/routes/ai_cost.py, dashboard/routes/ai_learning.py, dashboard/routes/runbooks.py]
    criticality: high
    tests: [tests/test_ai_cost.py, tests/test_dashboard_ai_learning.py, tests/test_remediation_runbook.py]
  dashboard.ai_tasks_unmounted:
    kind: unmounted_route_module
    source: [dashboard/routes/ai_tasks.py]
    criticality: medium
    tests: []
    status: imported_but_router_not_registered
    notes: Module exists but dashboard.app does not include its router; do not count as a served feature.
  dashboard.cinder_backups:
    kind: route_group
    source: [dashboard/routes/cinder_backups.py]
    criticality: high
    tests: [tests/test_cinder_discovery.py, tests/test_cinder_mapping_api.py]
  dashboard.federated_iam:
    kind: route_group
    source: [dashboard/routes/federated_iam.py]
    criticality: critical
    tests: [tests/test_federated_iam.py, tests/test_federated_iam_sts.py, tests/test_federated_iam_worker.py]
  dashboard.storage_audit:
    kind: route_group
    source: [dashboard/routes/storage_audit.py]
    criticality: high

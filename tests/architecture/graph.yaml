    source: [dashboard/routes/settings.py, dashboard/routes/users.py, dashboard/routes/maintenance.py, dashboard/routes/capability_matrix.py, dashboard/routes/openstack.py, dashboard/routes/rbac.py]
    criticality: high
    tests: [tests/test_dashboard_settings.py, tests/test_dashboard_users.py, tests/test_dashboard_capability_matrix.py, tests/test_dashboard_openstack.py, tests/test_rbac_authorization.py]

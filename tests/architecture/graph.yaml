  external.backup_targets:
    kind: external_system
    criticality: critical
    tests: [tests/test_backup_storage_ssh.py, tests/test_backup_storage_s3.py]
  external.ai_provider:
    kind: external_system
    criticality: high
    tests: [tests/test_router_client_shared.py, tests/test_chat_client.py]
  external.telegram:
    kind: external_system
    criticality: high
    tests: [tests/test_telegram_client.py, tests/test_shared_telegram_alerts.py]
  external.logs:
    kind: external_system
    criticality: medium
    tests: [tests/test_log_source_loki.py, tests/test_ceph_log.py]
  external.vitastor:
    kind: external_system
    criticality: critical
    tests: [tests/test_vitastor_client.py, tests/test_vitastor_operations.py]
  external.vault_identity:
    kind: external_system
    criticality: high
    tests: [tests/test_ldap_identity.py]
    notes: Optional secret backend only; not the identity provider itself.
  external.identity_provider:
    kind: external_system
    criticality: high
    tests: [tests/test_federated_iam.py, tests/test_federated_iam_sts.py, tests/test_ldap_identity.py]
    notes: OIDC or LDAP/AD endpoint, depending on configured provider and implemented path.

  event.incident_queue:
    kind: event
    source: [shared/mq.py, watcher/publisher.py]
    criticality: critical
    tests: [tests/test_publisher.py, tests/test_worker_main.py]
  event.incidents_changed_ws:
    kind: event
    source: [dashboard/ws.py, dashboard/static/app.js]
    criticality: high
    tests: [tests/test_dashboard_ws.py]
    notes: Poll-based DB fingerprint notification.
  event.action_state_changed:
    kind: event
    source: []
    criticality: high
    tests: []
    status: not_implemented_as_shared_event
    notes: Action state is persisted/read by APIs; no common event producer/consumer is wired in the reviewed code.

flows:
  flow.dashboard_read:
    criticality: critical
    nodes: [browser.ceph_jinja, browser.react, dashboard.app, config.runtime, data.request_observability, dashboard.auth, dashboard.cluster_scope, dashboard.block_storage, dashboard.nodes_monitoring, data.ceph_query_cache, data.sqlalchemy, watcher.ceph_client, external.ceph]
    tests: [tests/test_dashboard_health_api.py, tests/test_dashboard_nodes.py, tests/test_dashboard_volumes.py, tests/test_dashboard_block_storage.py, tests/test_ceph_client.py]
  flow.watcher_incident_diagnosis:
    criticality: critical
    nodes: [config.runtime, watcher.main, watcher.remediation, watcher.collectors, watcher.ceph_client, data.sqlalchemy, watcher.incident_publisher, event.incident_queue, external.rabbitmq, worker.main, worker.diagnosis, ai.shared_client, external.ai_provider]
    tests: [tests/test_watcher_incident_flow.py, tests/test_remediation_watcher.py, tests/test_worker_main.py, tests/test_router_client.py]
  flow.approval_execution:
    criticality: critical
    nodes: [browser.ceph_jinja, browser.chat_widget, dashboard.app, dashboard.actions, dashboard.chat, dashboard.auth, dashboard.cluster_scope, data.request_observability, data.sqlalchemy, data.audit, worker.main, worker.policy, worker.executor, external.ceph, external.openstack, external.rgw_s3]
    tests: [tests/test_dashboard_actions.py, tests/test_dashboard_chat.py, tests/test_policy_gate.py, tests/test_commands.py, tests/test_audit.py]
  flow.backup_restore:
    criticality: critical
    nodes: [config.runtime, dashboard.backup_restore, data.sqlalchemy, worker.main, worker.backup, worker.executor, external.ceph, external.backup_targets, data.audit]
    tests: [tests/test_dashboard_backups.py, tests/test_backup_engine.py, tests/test_backup_restore.py, tests/test_restore_drill.py]
  flow.object_storage:
    criticality: critical
    nodes: [config.runtime, dashboard.object_storage, dashboard.auth, dashboard.cluster_scope, data.object_storage_cache, data.request_observability, data.audit, worker.executor, worker.bucket_logging, worker.rgw_audit, external.rgw_s3, external.telegram]
    tests: [tests/test_dashboard_object_storage.py, tests/test_dashboard_object_storage_users.py, tests/test_dashboard_bucket_access_log.py, tests/test_policy_gate.py]
  flow.chat:
    criticality: high
    nodes: [browser.chat_widget, dashboard.chat, dashboard.vitastor, ai.shared_client, worker.diagnosis, data.sqlalchemy, worker.policy, worker.executor, external.ai_provider]
    tests: [tests/test_dashboard_chat.py, tests/test_dashboard_vitastor_chat.py, tests/test_chat_client.py, tests/test_router_client_shared.py]
  flow.vitastor_product:
    criticality: critical
    nodes: [dashboard.vitastor, watcher.vitastor, data.sqlalchemy, external.vitastor, worker.policy, worker.executor]
    tests: [tests/test_dashboard_vitastor_dashboard.py, tests/test_vitastor_monitor.py, tests/test_vitastor_operations.py, tests/test_vitastor_remediation.py]
  flow.federated_iam:
    criticality: high
    nodes: [dashboard.federated_iam, dashboard.auth, dashboard.cluster_scope, shared.directory_identity, worker.main, worker.federated_iam, data.sqlalchemy, data.audit, external.identity_provider, external.vault_identity, external.rgw_s3]
    tests: [tests/test_federated_iam.py, tests/test_federated_iam_sts.py, tests/test_federated_iam_worker.py, tests/test_ldap_identity.py]
  flow.installation_stream:
    criticality: high
    nodes: [browser.ceph_jinja, browser.react, dashboard.app, dashboard.installation_stream, dashboard.auth, dashboard.cluster_scope, shared.installation_profile, config.runtime, data.cluster_registry, data.sqlalchemy]
    tests: [tests/test_dashboard_installation_stream.py, tests/test_architecture_profile.py]


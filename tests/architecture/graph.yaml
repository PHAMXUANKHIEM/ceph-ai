    tests: [tests/test_dashboard_clusters.py, tests/test_dashboard_deploy_cluster.py, tests/test_dashboard_delete_cluster.py, tests/test_dashboard_convert_cluster.py, tests/test_dashboard_upgrade.py, tests/test_dashboard_patch.py]
  dashboard.admin:

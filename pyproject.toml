[project]
name = "ceph-aiops"
version = "0.1.0"
description = "AIOps monitoring & safe auto-remediation tool for Ceph clusters"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "pydantic-settings==2.14.2",
    "aio-pika==10.0.1",
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "bcrypt==5.0.0",
    "itsdangerous==2.2.0",
    "paramiko==5.0.0",
    "cryptography==50.0.1",
    "openai==2.46.0",
    "httpx==0.28.1",
    "ldap3==2.9.1",
    "pyyaml==6.0.3",
    "psycopg[binary]==3.3.4",
    "boto3==1.43.59",
    "apscheduler==3.11.3",
    "openpyxl==3.1.5",
    "river==0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "coverage==7.16.1",
]
benchmark = [
    "pyod==2.0.5",
    "scikit-learn==1.5.2",
]
benchmark-forecast = [
    "statsforecast==2.1.1",
]
benchmark-anomaly = [
    "rrcf==0.4.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["watcher*", "worker*", "dashboard*", "shared*", "config*", "scripts*", "vitastor*"]

[tool.setuptools.package-data]
dashboard = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: makes real network/SSH calls to the Ceph lab cluster — excluded by default, run with `pytest -m live`",
    "integration: requires an external service such as RabbitMQ",
]
addopts = "-m 'not live and not integration'"

[tool.coverage.run]
# Used by the CI coverage gate (scripts/ci/coverage_gate.py). Plain `pytest`
# stays uninstrumented; CI passes --cov explicitly.
source = ["config", "dashboard", "scripts", "shared", "watcher", "worker"]
branch = true
relative_files = true

[tool.coverage.report]
skip_empty = true

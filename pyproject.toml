[project]
name = "ceph-aiops"
version = "0.1.0"
description = "AIOps monitoring & safe auto-remediation tool for Ceph clusters"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy==2.0.51",
    "alembic==1.18.5",
    "pydantic-settings==2.14.2",
    "aio-pika==10.0.1",
    "fastapi==0.139.0",
    "uvicorn[standard]==0.51.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
    "bcrypt==5.0.0",
    "itsdangerous==2.2.0",
    "paramiko==5.0.0",
    "openai==2.46.0",
    "httpx==0.28.1",
    "pyyaml==6.0.3",
    "psycopg[binary]==3.3.4",
    "boto3==1.43.59",
    "apscheduler==3.11.3",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["watcher*", "worker*", "dashboard*", "shared*", "config*", "scripts*", "vitastor*"]

[tool.setuptools.package-data]
dashboard = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
markers = [
    "live: makes real network/SSH calls to the Ceph lab cluster — excluded by default, run with `pytest -m live`",
]
addopts = "-m 'not live'"

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # A real (ephemeral, CI-only) broker — tests/test_mq.py needs one it
    # doesn't share with any other consumer, which a locally-run dev
    # instance can't guarantee (see that file's own comment on this).
    services:
      rabbitmq:
        image: docker.io/library/rabbitmq:3.13-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: ceph-health-dashboard/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install --upgrade 'pip>=26.2'
          python -m pip --version
          # Same hashed dependency set as the runtime image; the dev
          # extra only adds test tools on top of it.
          python -m pip install --require-hashes -r requirements-prod.lock
          pip install -e .[dev]
          python scripts/ci/verify_lock_parity.py

      - name: Build Ceph Health dashboard
        run: npm --prefix ceph-health-dashboard ci && npm --prefix ceph-health-dashboard run build

      - name: Verify default pytest collection root
        run: python scripts/ci/verify_pytest_collection.py

      - name: Run tests (Python ${{ matrix.python-version }})
        run: |
          mkdir -p artifacts
          pytest --junitxml="artifacts/pytest-${{ matrix.python-version }}.xml" \
            --cov --cov-report="xml:artifacts/coverage-${{ matrix.python-version }}.xml" \
            --cov-report="html:artifacts/coverage-html-${{ matrix.python-version }}"
        # `-m 'not live'` is already pytest's default (pyproject.toml
        # addopts) — the `live` suite makes real SSH/network calls to the
        # actual Ceph lab cluster and only ever runs manually, never in CI.

      - name: Summarize test failures
        if: failure()
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
        run: |
          python - <<'PY'
          import html
          import os
          import pathlib
          import xml.etree.ElementTree as ET

          xml_path = pathlib.Path("artifacts") / f"pytest-{os.environ['PYTHON_VERSION']}.xml"
          summary_path = pathlib.Path("artifacts") / f"pytest-failures-{os.environ['PYTHON_VERSION']}.txt"
          failures = []
          if xml_path.exists():
              root = ET.parse(xml_path).getroot()
              for case in root.iter("testcase"):
                  failure = case.find("failure")
                  error = case.find("error")
                  detail = failure if failure is not None else error
                  if detail is None:
                      continue
                  name = f"{case.attrib.get('classname', '')}::{case.attrib.get('name', '')}"
                  message = (detail.attrib.get("message") or detail.text or "").strip()
                  failures.append((name, message[:1000]))
          lines = [f"Python {os.environ['PYTHON_VERSION']} pytest failures: {len(failures)}"]
          for name, message in failures:
              safe = message.replace("\n", " ").replace("%", "%25").replace("\r", "%0D")
              print(f"::error title=pytest failure,file=.github::{name}: {safe}")
              lines.append(f"- `{name}`: {message}")
          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          github_summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if github_summary:
              with open(github_summary, "a", encoding="utf-8") as stream:
                  stream.write("## Pytest failures\n\n" + "\n".join(lines) + "\n")
          PY

      - name: Enforce coverage gate (Python ${{ matrix.python-version }})
        # Runs after a test failure too, so the coverage report is always
        # produced; the baseline lives in scripts/ci/coverage_baseline.json.
        if: always() && hashFiles(format('artifacts/coverage-{0}.xml', matrix.python-version)) != ''
        run: |
          set -o pipefail
          python scripts/ci/coverage_gate.py \
            --coverage-xml "artifacts/coverage-${{ matrix.python-version }}.xml" \
            --junit "artifacts/pytest-${{ matrix.python-version }}.xml" \
            --output "artifacts/coverage-gate-${{ matrix.python-version }}.json" \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload test evidence (Python ${{ matrix.python-version }})
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-evidence-python-${{ matrix.python-version }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore

  quality:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      # Sigstore-signed SLSA build provenance for the pushed image digest.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # quality_gate.py compares the pushed commit with github.event.before.
          # A shallow checkout does not contain that baseline SHA.
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: ceph-health-dashboard/package-lock.json

      - name: Install application and pinned quality tools
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install --upgrade 'pip>=26.2'
          python -m pip --version
          # Same hashed dependency set as the runtime image; the dev
          # extra only adds test tools on top of it.
          python -m pip install --require-hashes -r requirements-prod.lock
          pip install -e .[dev]
          pip install ruff==0.12.10 mypy==1.17.1 bandit==1.8.6 pip-audit==2.9.0
          python scripts/ci/verify_lock_parity.py
          npm --prefix ceph-health-dashboard ci

      - name: Run blocking quality and security gate
        env:
          # Compare changed-file diagnostics with the commit's parent/base so
          # the existing static-analysis backlog cannot hide new regressions.
          QUALITY_BASE_SHA: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: |
          mkdir -p artifacts
          set -o pipefail
          python scripts/ci/quality_gate.py 2>&1 | tee artifacts/quality-gate.log

      - name: Full-tree static-analysis inventory and budget
        # Complements the changed-file gate above: the whole tree may not grow
        # past scripts/ci/static_analysis_budget.json (total or critical tier).
        run: |
          set -o pipefail
          python scripts/ci/static_analysis_inventory.py --output artifacts/static-analysis \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Audit Python dependencies
        run: |
          pip-audit --format=json --output artifacts/pip-audit.json --progress-spinner off

      - name: Verify pinned dependency licenses
        run: |
          python scripts/ci/dependency_license_report.py \
            --output artifacts/dependency-licenses.json

      - name: Build immutable CI image
        env:
          IMAGE_TAG: ceph-ai:ci-${{ github.sha }}
        run: |
          set -euo pipefail
          docker build --pull --build-arg GIT_COMMIT="$GITHUB_SHA" --tag "$IMAGE_TAG" .
          docker image inspect "$IMAGE_TAG" --format '{{.Id}}' > artifacts/image-digest.txt

      - name: Scan image for blocking vulnerabilities
        env:
          IMAGE_TAG: ceph-ai:ci-${{ github.sha }}
        run: |
          set +e
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$PWD/artifacts:/out" \
            aquasec/trivy:0.64.1@sha256:a8ca29078522f30393bdb34225e4c0994d38f37083be81a42da3a2a7e1488e9e image \
            --format json --output /out/trivy-image.json \
            --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed "$IMAGE_TAG"
          rc=$?
          set -e
          exit "$rc"

      - name: Generate image SBOM
        env:
          IMAGE_TAG: ceph-ai:ci-${{ github.sha }}
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock:ro \
            -v "$PWD/artifacts:/out" \
            anchore/syft:v1.18.1@sha256:b8c170b8e51bfc4779ec3ef4399942c57290f5ce76a9c3af564c9d00d4946a6b "docker:$IMAGE_TAG" \
            -o cyclonedx-json=/out/sbom.cyclonedx.json

      - name: Push the scanned image and record its registry digest
        id: push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_TAG: ceph-ai:ci-${{ github.sha }}
        run: |
          set -euo pipefail
          registry_image="ghcr.io/${GITHUB_REPOSITORY,,}"
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE_TAG" "$registry_image:${GITHUB_SHA}"
          docker push "$registry_image:${GITHUB_SHA}" | tee artifacts/image-push.log
          digest="$(awk '/digest: sha256:/ {print $3}' artifacts/image-push.log | tail -1)"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          printf '%s@%s\n' "$registry_image" "$digest" > artifacts/registry-image-ref.txt
          printf 'name=%s\ndigest=%s\n' "$registry_image" "$digest" >> "$GITHUB_OUTPUT"
          # Stay logged in: the attestation below pushes to the same registry.

      - name: Attest build provenance for the pushed digest
        id: attest
        if: steps.push.outcome == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Record provenance evidence
        if: steps.attest.outcome == 'success'
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          ATTESTATION_URL: ${{ steps.attest.outputs.attestation-url }}
          SUBJECT_DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          set -euo pipefail
          cp "$BUNDLE_PATH" artifacts/provenance-bundle.jsonl
          python - <<'PY'
          import hashlib, json, os, pathlib
          bundle = pathlib.Path("artifacts/provenance-bundle.jsonl")
          pathlib.Path("artifacts/provenance.json").write_text(json.dumps({
              "status": "attested",
              "predicate_type": "https://slsa.dev/provenance/v1",
              "subject_digest": os.environ["SUBJECT_DIGEST"],
              "attestation_id": os.environ["ATTESTATION_ID"],
              "attestation_url": os.environ["ATTESTATION_URL"],
              "bundle_sha256": hashlib.sha256(bundle.read_bytes()).hexdigest(),
          }, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Log out of GHCR
        if: always() && steps.push.outcome != 'skipped'
        run: docker logout ghcr.io || true

      - name: Surface quality gate evidence
        if: failure()
        run: |
          summary="artifacts/quality/quality-summary.txt"
          if [ -f "$summary" ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=quality gate::$line"
            done < "$summary"
            {
              echo "## Quality gate failure"
              cat "$summary"
            } >> "$GITHUB_STEP_SUMMARY"
          elif [ -f artifacts/quality-gate.log ]; then
            while IFS= read -r line; do
              [ -n "$line" ] && echo "::error title=quality gate traceback::$line"
            done < artifacts/quality-gate.log
            {
              echo "## Quality gate traceback"
              cat artifacts/quality-gate.log
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error title=quality gate::quality-summary.txt was not produced"
          fi

      - name: Upload quality and security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-security-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn

  deploy:
    needs: [test, quality, release_gate, integration]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, ceph-ai-lab]
    permissions:
      contents: read
      packages: read
    timeout-minutes: 30
    concurrency:
      group: ceph-ai-lab-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: quality-security-evidence-${{ github.sha }}
          path: deploy-artifacts

      - name: Run read-only deployment preflight
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CEPH_AI_DEPLOY_DIR: ${{ vars.CEPH_AI_DEPLOY_DIR || '/root/ceph-ai' }}
          CEPH_AI_PREFLIGHT_REPORT: ${{ runner.temp }}/ceph-ai-deploy-evidence/deploy-preflight.log
        run: |
          set -uo pipefail
          install -d -m 0700 "$(dirname "$CEPH_AI_PREFLIGHT_REPORT")"
          console="$(dirname "$CEPH_AI_PREFLIGHT_REPORT")/deploy-preflight-console.log"
          rc=0
          bash scripts/deploy/deploy_preflight.sh 2>&1 | tee "$console" || rc=$?
          if [ "$rc" -ne 0 ]; then
            # Job logs need repository admin rights; annotations do not.
            # The preflight output is secret-free by design (no DATABASE_URL
            # or credentials), so every failed check is surfaced as one.
            grep -h 'status=FAIL' "$console" | sort -u | while IFS= read -r line; do
              echo "::error title=deploy preflight::$line"
            done
            grep -q 'status=FAIL' "$console" || echo "::error title=deploy preflight::exited $rc without a FAIL line"
          fi
          exit "$rc"

      - name: Deploy pushed commit to the container stack
        env:
          DEPLOY_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_EVIDENCE_DIR: ${{ runner.temp }}/ceph-ai-deploy-evidence
          CEPH_AI_DEPLOY_ALLOWED_DIRTY_PATHS: Plan/in-progress/natural-language-ceph-ai-plan.md
          # The active compose deployment lives here. A self-hosted runner
          # may override this repository variable for another lab host.
          CEPH_AI_DEPLOY_DIR: ${{ vars.CEPH_AI_DEPLOY_DIR || '/root/ceph-ai' }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$DEPLOY_EVIDENCE_DIR"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          image_ref="unknown"
          set +e
          {
            image_ref="$(< deploy-artifacts/registry-image-ref.txt)"
            [[ "$image_ref" =~ ^ghcr\.io/[a-z0-9._/-]+@sha256:[a-f0-9]{64}$ ]]
            printf '%s' "$GH_TOKEN" | podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
            cd "$CEPH_AI_DEPLOY_DIR"
            test "$(git rev-parse --show-toplevel)" = "$CEPH_AI_DEPLOY_DIR"
            CEPH_AI_DEPLOY_EVENT_LOG="$DEPLOY_EVIDENCE_DIR/deploy-phases.log" \
              CEPH_AI_DEPLOY_RUNNING_IMAGES="$DEPLOY_EVIDENCE_DIR/running-images.jsonl" \
              CEPH_AI_DEPLOY_ROLLBACK_RECORD="$DEPLOY_EVIDENCE_DIR/rollback-target.json" \
              CEPH_AI_IMAGE="$image_ref" DEPLOY_REF="$DEPLOY_SHA" \
              bash scripts/deploy/restart_container_stack.sh
          } > >(python3 "$GITHUB_WORKSPACE/scripts/deploy/redact_deploy_output.py" | tee "$DEPLOY_EVIDENCE_DIR/deploy-stdout.log") \
            2> >(python3 "$GITHUB_WORKSPACE/scripts/deploy/redact_deploy_output.py" | tee "$DEPLOY_EVIDENCE_DIR/deploy-stderr.log" >&2)
          deploy_exit=$?
          set -e
          finished_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          target_host="$(hostname --fqdn 2>/dev/null || hostname)"
          {
            printf 'deploy_sha=%s\n' "$DEPLOY_SHA"
            printf 'image_ref=%s\n' "$image_ref"
            printf 'target_host=%s\n' "$target_host"
            printf 'started_at=%s\n' "$started_at"
            printf 'finished_at=%s\n' "$finished_at"
            printf 'exit_code=%s\n' "$deploy_exit"
          } > "$DEPLOY_EVIDENCE_DIR/deploy-result.env"
          chmod 0640 "$DEPLOY_EVIDENCE_DIR"/deploy-*.log "$DEPLOY_EVIDENCE_DIR/deploy-result.env" \
            "$DEPLOY_EVIDENCE_DIR/running-images.jsonl" "$DEPLOY_EVIDENCE_DIR/rollback-target.json" 2>/dev/null || true
          exit "$deploy_exit"

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: deploy-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/ceph-ai-deploy-evidence/
          if-no-files-found: warn

  release_gate:
    needs: [test, quality]
    if: always() && needs.test.result == 'success' && needs.quality.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20.x"

      - name: Install release-gate dependencies on the clean runner
        run: |
          python -m pip install --upgrade pip setuptools
          # Same hashed dependency set as the runtime image; the dev
          # extra only adds test tools on top of it.
          python -m pip install --require-hashes -r requirements-prod.lock
          pip install -e .[dev]
          python scripts/ci/verify_lock_parity.py

      - name: Download test and quality evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "*-evidence-*"
          path: artifacts
          merge-multiple: true

      - name: Verify release evidence
        run: python scripts/ci/release_gate.py --require-ci-artifacts

      - name: Verify documentation freshness
        run: |
          python scripts/ci/documentation_freshness.py \
            --output artifacts/release/documentation-freshness.json

      - name: Bind release identity into a manifest
        env:
          CEPH_AI_IMAGE: ceph-ai:ci-${{ github.sha }}
        run: |
          python scripts/ci/release_manifest.py \
            --environment ci \
            --output artifacts/release/release-manifest.json

      - name: Upload release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.sha }}
          path: artifacts/release/
          if-no-files-found: error


  integration:
    # The MQ integration suite is release-blocking on push/PR. Destructive
    # live tests remain a separate manual job below.
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      rabbitmq:
        image: docker.io/library/rabbitmq:3.13-management@sha256:e582c0bc7766f3342496d8485efb5a1df782b5ce3886ad017e2eaae442311f69
        # RabbitMQ restricts the built-in guest user to loopback inside the
        # broker container. The runner reaches this service through the
        # published port, so use a disposable CI-only account instead.
        env:
          RABBITMQ_DEFAULT_USER: ceph_ai_ci
          RABBITMQ_DEFAULT_PASS: ceph-ai-ci-only-password
          RABBITMQ_DEFAULT_VHOST: /
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          # Same hashed dependency set as the runtime image; the dev
          # extra only adds test tools on top of it.
          python -m pip install --require-hashes -r requirements-prod.lock
          pip install -e .[dev]
          python scripts/ci/verify_lock_parity.py
      - name: Run integration suite explicitly
        env:
          RABBITMQ_URL: amqp://ceph_ai_ci:ceph-ai-ci-only-password@127.0.0.1:5672/
        run: |
          mkdir -p artifacts
          pytest -m integration --junitxml=artifacts/pytest-integration.xml
      - name: Upload integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore

  live:
    if: github.event_name == 'workflow_dispatch' && vars.CEPH_AI_RUN_LIVE_TESTS == 'true'
    runs-on: [self-hosted, linux, x64, ceph-ai-lab]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          # Same hashed dependency set as the runtime image; the dev
          # extra only adds test tools on top of it.
          python -m pip install --require-hashes -r requirements-prod.lock
          pip install -e .[dev]
          python scripts/ci/verify_lock_parity.py
      - name: Run live suite explicitly
        run: |
          mkdir -p artifacts
          pytest -m live --junitxml=artifacts/pytest-live.xml
      - name: Upload live evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    # A real (ephemeral, CI-only) broker — tests/test_mq.py needs one it
    # doesn't share with any other consumer, which a locally-run dev
    # instance can't guarantee (see that file's own comment on this).
    services:
      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: ceph-health-dashboard/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .[dev]

      - name: Build Ceph Health dashboard
        run: npm --prefix ceph-health-dashboard ci && npm --prefix ceph-health-dashboard run build

      - name: Run tests (Python ${{ matrix.python-version }})
        run: |
          mkdir -p artifacts
          pytest --junitxml="artifacts/pytest-${{ matrix.python-version }}.xml"
        # `-m 'not live'` is already pytest's default (pyproject.toml
        # addopts) — the `live` suite makes real SSH/network calls to the
        # actual Ceph lab cluster and only ever runs manually, never in CI.

      - name: Upload test evidence (Python ${{ matrix.python-version }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-evidence-python-${{ matrix.python-version }}-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore

  quality:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: npm
          cache-dependency-path: ceph-health-dashboard/package-lock.json

      - name: Install application and pinned quality tools
        run: |
          python -m pip install --upgrade pip setuptools
          pip install -e .[dev]
          pip install ruff==0.12.10 mypy==1.17.1 bandit==1.8.6 pip-audit==2.9.0
          npm --prefix ceph-health-dashboard ci

      - name: Collect static and dependency reports
        continue-on-error: true
        run: |
          mkdir -p artifacts
          ruff check . --output-format sarif --output-file artifacts/ruff.sarif || true
          mypy dashboard config shared watcher worker vitastor --ignore-missing-imports \
            --junit-xml artifacts/mypy.xml || true
          bandit -q -r dashboard config shared watcher worker vitastor \
            -f sarif -o artifacts/bandit.sarif || true
          pip-audit --format json --output artifacts/pip-audit.json || true
          npm --prefix ceph-health-dashboard audit --omit=dev --json > artifacts/npm-audit.json || true
          npm --prefix ceph-health-dashboard run build || true

      - name: Upload quality and security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-security-evidence-${{ github.sha }}
          path: artifacts/
          if-no-files-found: warn

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, ceph-ai-lab]
    timeout-minutes: 30
    concurrency:
      group: ceph-ai-lab-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy pushed commit to the container stack
        env:
          DEPLOY_SHA: ${{ github.sha }}
          # The active compose deployment lives here. A self-hosted runner
          # may override this repository variable for another lab host.
          CEPH_AI_DEPLOY_DIR: ${{ vars.CEPH_AI_DEPLOY_DIR || '/root/ceph-ai' }}
        run: |
          set -euo pipefail
          cd "$CEPH_AI_DEPLOY_DIR"
          test "$(git rev-parse --show-toplevel)" = "$CEPH_AI_DEPLOY_DIR"
          DEPLOY_REF="$DEPLOY_SHA" bash scripts/deploy/restart_container_stack.sh

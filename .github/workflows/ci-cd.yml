name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # A real (ephemeral, CI-only) broker — tests/test_mq.py needs one it
    # doesn't share with any other consumer, which a locally-run dev
    # instance can't guarantee (see that file's own comment on this).
    services:
      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Build Ceph Health dashboard
        run: npm --prefix ceph-health-dashboard install && npm --prefix ceph-health-dashboard run build

      - name: Run tests
        run: pytest
        # `-m 'not live'` is already pytest's default (pyproject.toml
        # addopts) — the `live` suite makes real SSH/network calls to the
        # actual Ceph lab cluster and only ever runs manually, never in CI.

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: [self-hosted, linux, x64, ceph-ai-lab]
    timeout-minutes: 30
    concurrency:
      group: ceph-ai-lab-deploy
      cancel-in-progress: false
    steps:
      - name: Deploy pushed commit to lab-hapu-ctl
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          cd /opt/ceph-ai
          test "$(git rev-parse --show-toplevel)" = "/opt/ceph-ai"
          test -z "$(git status --porcelain)"
          git fetch --prune origin main
          git cat-file -e "${DEPLOY_SHA}^{commit}"
          DEPLOY_REF="$DEPLOY_SHA" bash scripts/deploy/restart_services.sh
          curl -fsS --max-time 10 http://127.0.0.1:8000/login >/dev/null

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # A real (ephemeral, CI-only) broker — tests/test_mq.py needs one it
    # doesn't share with any other consumer, which a locally-run dev
    # instance can't guarantee (see that file's own comment on this).
    services:
      rabbitmq:
        image: rabbitmq:3.13-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .[dev]

      - name: Run tests
        run: pytest
        # `-m 'not live'` is already pytest's default (pyproject.toml
        # addopts) — the `live` suite makes real SSH/network calls to the
        # actual Ceph lab cluster and only ever runs manually, never in CI.

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: bash ${{ secrets.DEPLOY_PATH }}/scripts/deploy/restart_services.sh

# v1 (Story 2.3): closed enum of valid `action_id` values — this is what
# constrains Claude's tool-use schema (AD-5: "action_id đóng từ structured
# output, không parse free text").
#
# Story 3.1 (Epic 3) will ADD `safe:`/`risky:` classification lists to THIS
# SAME FILE, referencing these same action_id values — it will not rename or
# move them, and this story does not classify Safe/Risky at all.
action_ids:
  - restart_osd_daemon
  - resync_ntp
  - pg_repair_force
  - investigate_manually  # fallback: no automated action applies
  - hard_reboot_node      # RAM >= 90% for two node-health scans; always approval-gated
  # 2026-08-01 (Story A, Crash-module visibility): remediates RECENT_CRASH —
  # `ceph crash archive-all` takes no id argument (unlike pg_repair_force's
  # PG id, which is why THAT one still has no command — see commands.py),
  # so this is safe to add to the closed enum the same way resync_ntp is.
  - crash_archive_all
  # OSD_UPGRADE_FINISHED: Ceph health detail carries the release codename;
  # the Worker resolves it deterministically and proposes the compatibility
  # floor change for operator approval.
  - finalize_osd_release

# 2026-07-23: cluster-MANAGEMENT actions the Chat-with-AI feature
# (dashboard/chat_client.py) can propose — deliberately a SEPARATE list from
# `action_ids` above, not merged into it: `action_ids` constrains the
# Incident-diagnosis tool schema (worker/llm/router_client.py), and none of
# these make sense as an automated response to a detected HEALTH_WARN/
# HEALTH_ERR incident — they require operator-supplied parameters (pool
# name, pg_num, size, osd id) an Incident envelope never carries, and a
# hallucinated "create_pool" recommendation for an unrelated incident would
# be actively wrong. worker/policy/gate.py loads this as
# VALID_MANAGEMENT_ACTION_IDS; worker/llm/router_client.py's VALID_ACTION_IDS
# (Incident-diagnosis enum) is untouched by this list's existence.
management_action_ids:
  - edit_pool
  - scrub_pool
  - set_pool_protection
  - execute_node_command
  - create_pool
  - delete_pool
  - set_pool_size
  - set_pool_pg_num
  - mark_osd_out
  - mark_osd_in
  - mark_osd_down
  - enable_pool_application
  # Finalize the OSD compatibility level after every daemon has already
  # been upgraded to Pacific or newer. Chat verifies live health detail
  # before proposing it; changing the compatibility floor is irreversible.
  - finalize_pacific_osd_release
  # 2026-07-28: Dashboard "Volumes" page's Trash section
  # (dashboard/routes/volumes.py) — permanently purges an RBD image an
  # operator already soft-deleted into a pool's trash. Proposed via a
  # dedicated Dashboard button (its own propose route, same pattern as
  # cluster_deploy_action_ids/cluster_upgrade_action_ids below), NOT via
  # Chat-with-AI — reuses this family only because the pool_name-based
  # command-builder validation is identical, not because it goes through
  # dashboard/routes/chat.py's confirm flow.
  - rbd_trash_remove
  - rbd_create_volume
  - rbd_resize_volume
  - rbd_rename_volume
  - rbd_trash_move_volume
  - rbd_trash_restore_volume

# v1 (Story 3.1): Safe/Risky classification (AD-5). Anything NOT in `safe`
# defaults to RISKY — including action_ids present in `action_ids` above but
# absent from both lists here (e.g. investigate_manually), and any future
# action_id that gets added to `action_ids` without an explicit safe entry.
# This is an operational decision, not an architectural one — adjust freely
# without touching code.
# 2026-07-23: Cluster Upgrade feature (Dashboard "Nâng cấp cụm" page) — a
# THIRD separate action_id family, same reasoning as management_action_ids
# above: this is never proposed by the Incident-diagnosis pipeline
# (worker/llm/router_client.py) or Chat-with-AI, only by an operator
# explicitly clicking "Đề xuất nâng cấp" on dashboard/routes/upgrade.py
# after reviewing the current cluster version. worker/policy/gate.py loads
# this as VALID_CLUSTER_UPGRADE_ACTION_IDS.
#
# 2026-07-23: extended with two more members for clusters NOT managed by
# cephadm (ceph_exec_mode="none" — the traditional/"ceph-deploy" package
# install style, no orchestrator available) — `ceph orch upgrade` simply
# doesn't work there, so the Upgrade page offers a package-based upgrade
# instead: either download the target release from download.ceph.com, or
# install from an already-staged local directory on each node.
cluster_upgrade_action_ids:
  - upgrade_ceph_cluster
  - upgrade_ceph_cluster_package_download
  - upgrade_ceph_cluster_package_local

# 2026-07-24: Ceph patch build & deploy pipeline (Dashboard "Vá lỗi Ceph"
# page, dashboard/routes/patch.py) — a FOURTH separate action_id family,
# same reasoning as cluster_upgrade_action_ids above: never proposed by the
# Incident-diagnosis pipeline or Chat-with-AI, only by an operator
# explicitly uploading a patch and clicking "Đề xuất" on that page.
# worker/policy/gate.py loads this as VALID_PATCH_ACTION_IDS.
# patch_build_and_stage only ever touches the separate build server
# (shared/cluster_nodes.py::patch_build_node(), NOT a Ceph node);
# patch_install is the one that actually installs the built packages onto
# the live Ceph nodes and restarts daemons there.
patch_action_ids:
  - patch_build_and_stage
  - patch_install

# 2026-07-25: Dựng cụm Ceph tự động (Dashboard "Dựng cụm" page,
# dashboard/routes/deploy_cluster.py) — a FIFTH separate action_id family,
# same reasoning as cluster_upgrade_action_ids/patch_action_ids above: never
# proposed by the Incident-diagnosis pipeline or Chat-with-AI, only by an
# operator explicitly filling in the node table and clicking "Bắt đầu cài
# đặt". Unlike every other family here, this one targets nodes that are NOT
# yet part of any monitored cluster (a brand-new deploy, not a remediation
# of an existing one) — worker/policy/gate.py loads this as
# VALID_CLUSTER_DEPLOY_ACTION_IDS. One id per install method (Story 8.1 only
# wires up real execution for deploy_cluster_cephadm; the other two are
# registered now so Stories 8.2/8.3 need zero policy-layer changes).
# 2026-07-26: Xóa cụm Ceph (dashboard/routes/delete_cluster.py) added to
# this SAME family (not a new one) — it shares worker/executor/
# cluster_deploy.py's phase-runner, dispatch check, and policy-loading with
# the deploy action_ids above (this yaml key's name is now slightly
# imprecise — "cluster lifecycle" would be more accurate — but renaming it
# would touch gate.py/tests/comments for no functional gain). One id per
# how the cluster currently reports itself as run (CEPH_EXEC_MODE), decided
# automatically by the route, not chosen by the operator the way deploy's
# 3 install methods are.
# 2026-07-28: Chuyển đổi cụm đang chạy systemd sang cephadm
# (dashboard/routes/convert_cluster.py) — same family, same reasoning:
# shares worker/executor/cluster_deploy.py's phase-runner/dispatch-check/
# policy-loading. Deliberately one-directional (systemd -> cephadm only,
# via Ceph's own documented `cephadm adopt --style legacy` procedure) —
# the reverse (cephadm -> systemd) has no equivalent official Ceph
# command and was explicitly scoped OUT per an operator decision when
# this feature was requested (higher risk, no upstream-documented
# procedure to follow). NOT verified against a real running systemd
# cluster this session (see cluster_deploy.py's own phase docstrings) —
# test against a non-critical cluster first.
#
# 2026-07-31 (Story 9.7): `restore_cluster_from_backup` (Ceph Backup & DR
# runbook's step 1+2+3 combined — rebuild an empty cluster then restore
# auth/CRUSH map/RBD images onto it) added to this SAME family, same
# reasoning: dispatches through worker/executor/cluster_deploy.py's own
# phase-runner (`_PHASES_BY_ACTION_ID`), not backup_action_ids: below,
# because it reuses `deploy_cluster_ceph_deploy`'s entire phase list
# verbatim plus 3 restore-only phases appended after it.
# 2026-08-05 (Epic 11, Story 11.3): `node_os_gate_prepare`/
# `node_os_gate_abort` (Gỡ mon/backup OSD before an operator wipes a
# node's OS, and undoing that if they never come back to Confirm) added
# to this SAME family — same reasoning, own phase lists in
# `_PHASES_BY_ACTION_ID`.
# 2026-08-05 (Epic 11, Story 11.4): `node_os_gate_recover` (Confirm +
# Node Recovery) added now that its phase list exists in
# `_PHASES_BY_ACTION_ID["node_os_gate_recover"]`.
cluster_deploy_action_ids:
  - deploy_cluster_cephadm
  - deploy_cluster_ceph_deploy
  - deploy_cluster_rpm_local
  - delete_cluster_cephadm
  - delete_cluster_manual
  - convert_cluster_to_cephadm
  - restore_cluster_from_backup
  - node_os_gate_prepare
  - node_os_gate_abort
  - node_os_gate_recover

# 2026-07-29: Volumes page "Đo hiệu năng tối đa" (load sweep) button
# (dashboard/routes/volumes.py) — a SEVENTH family, same reasoning as
# cluster_deploy_action_ids above: worker/executor/volume_perf.py is its
# own multi-step orchestrator (sweeps fio iodepth 1->256, not a single
# per-host command), so worker/llm/router_client.py dispatches it
# separately, same as the cluster-deploy family. Deliberately scoped to a
# dedicated SCRATCH image only, never the operator's real volume — an
# explicit operator decision when this feature was requested (confirmed
# via AskUserQuestion), specifically to keep this from ever contending
# with real traffic on real data.
volume_perf_action_ids:
  - volume_perf_sweep
  - vm_perf_benchmark

# 2026-07-30 (Epic 9, Story 9.1): Ceph Backup & Disaster Recovery — an
# EIGHTH family, same reasoning as cluster_deploy_action_ids/
# volume_perf_action_ids above: worker/backup/engine.py is its own
# bespoke orchestrator (rbd snapshot/export/retention, not a single
# per-host command), so worker/llm/router_client.py dispatches it
# separately. All 5 ids registered now (same "register the whole family,
# wire real execution incrementally" precedent Story 8.1 set for
# cluster_deploy_action_ids) even though Story 9.1 only wires real
# execution for rbd_backup_run/retention_sweep_delete — Stories 9.4/9.7
# need zero policy-layer changes when they land.
# 2026-07-31 (Story 9.3): backup_metadata_run added — a 6th member, not
# anticipated when this family was first registered (the PRD/architecture
# only enumerated 5 backup action_ids; cluster metadata backup turned out
# to need its own, separate from rbd_backup_run since it isn't tied to a
# (pool, image) pair). Dispatches through worker/backup/engine.py::run()
# same as the rest of this family, wired to worker/backup/metadata.py.
backup_action_ids:
  - rbd_backup_run
  - retention_sweep_delete
  - restore_drill_execute
  - restore_rbd_image_to_production
  - backup_delete_manual
  - backup_metadata_run

# 2026-08-01 (Story C, DeviceHealth-driven evacuation): a NINTH family, same
# reasoning as every other family above — watcher/device_health_monitor.py
# proposes this directly (Incident+Action created straight at
# PENDING_APPROVAL, no Incident-diagnosis AI round trip, same posture as
# watcher/volume_monitor.py's VOLUME_SATURATED: family), never via Chat-with-
# AI or the automated Incident-diagnosis pipeline. Deliberately a SEPARATE
# action_id from Chat's own `mark_osd_out` even though the resulting command
# is identical (worker/executor/commands.py::_DEVICE_HEALTH_COMMAND_BUILDERS)
# — so this can be classified RISKY independently of mark_osd_out's SAFE
# classification below, which exists for Chat's own different safeguards
# (operator types the osd_id and reviews the resolved preview before
# confirming; nothing analogous happens for a system-generated proposal).
device_health_action_ids:
  - evacuate_predicted_failing_osd

# 2026-08-04: BlueStore per-pool omap quick-fix — a TENTH family, same
# reasoning as every other family above. Proposed only from its own
# dedicated Dashboard picker (dashboard/routes/nodes.py), NOT Chat-with-AI
# free text and NOT the automated Incident-diagnosis pipeline — the
# operator picks a real osd_id from `ceph osd tree`
# (watcher/ceph_client.py::list_osds()) instead of typing/guessing one.
# See worker/executor/commands.py::_bluestore_omap_quick_fix_command's own
# comment for the full BLUESTORE_NO_PER_POOL_OMAP background and the known
# historical ceph-bluestore-tool corruption risk that makes this always
# RISKY, never SAFE.
bluestore_action_ids:
  - bluestore_omap_quick_fix

safe:
  - resync_ntp
  # 2026-07-23: operator explicitly requested every management action
  # execute immediately on chat confirm (single click via
  # dashboard/routes/chat.py's confirm-action endpoint), same as any other
  # Safe Action — INCLUDING delete_pool, acknowledged as permanent,
  # unrecoverable data loss with no second Dashboard approval step. The
  # remaining safeguards before execution: the chat confirm step itself
  # shows the fully-resolved command (real pool name/osd id baked in, see
  # dashboard/chat_client.py::resolve_command_preview) before the operator
  # immediately before execution (AD-4, no exceptions). To require a second
  # manual approval for any of these instead, just move it to `risky:`
  # below — no code change needed (same operational-decision posture as the
  # rest of this file).
  - create_pool
  - delete_pool
  - set_pool_size
  - set_pool_pg_num
  - edit_pool
  - scrub_pool
  - set_pool_protection
  - mark_osd_out
  - mark_osd_in
  - mark_osd_down
  # 2026-07-23: clears Ceph's own POOL_APP_NOT_ENABLED HEALTH_WARN — a
  # metadata tag, not a data-affecting change, safe to auto-execute like
  # the rest of this list.
  - enable_pool_application
  # 2026-07-30 (Epic 9, Story 9.1): rbd_backup_run is the scheduled backup
  # itself (read-only against the source cluster — snapshot + export,
  # never mutates anything an operator would want a chance to block) and
  # retention_sweep_delete only removes backups already superseded by
  # newer ones within a pre-approved keep-count (scoped, non-destructive
  # to anything still relevant) — both auto-executed on schedule like
  # resync_ntp above. restore_drill_execute (Story 9.4, scoped to a
  # dedicated scratch pool/image, never real data) is Safe for the same
  # reason volume_perf_sweep's scratch-image scoping is. Restoring over
  # LIVE production data (restore_rbd_image_to_production) or deleting a
  # backup outside the automatic retention schedule (backup_delete_manual)
  # stay in risky: below instead — always need explicit approval.
  - rbd_backup_run
  - retention_sweep_delete
  - restore_drill_execute
  # 2026-07-31 (Story 9.3): read-only against the source cluster (5 `ceph
  # ... get*`/`export`/`dump` commands, nothing mutates anything) — same
  # reasoning as rbd_backup_run above, auto-executed on schedule.
  - backup_metadata_run
  # 2026-08-01 (Story A, Crash-module visibility): `ceph crash archive-all`
  # only marks already-happened crash reports as acknowledged — a
  # metadata-only change, doesn't touch cluster state/data (same posture as
  # enable_pool_application above), so it's safe to auto-execute the moment
  # the AI diagnosis pipeline picks it, closing the RECENT_CRASH incident
  # loop with no operator toil for routine/known-benign crashes.
  - crash_archive_all

risky:
  - execute_node_command
  - restart_osd_daemon
  - finalize_osd_release
  # RAM >= 90% across two slow health scans. A forced host reboot can
  # interrupt MON/OSD traffic, so it must never run without approval.
  - hard_reboot_node
  - pg_repair_force
  - finalize_pacific_osd_release
  # 2026-07-23: a live cluster version upgrade is never auto-executed —
  # always requires an explicit Dashboard approval (AD-5's conservative
  # default already puts anything absent from `safe:` here; listed
  # explicitly for the same documentation reason enable_pool_application
  # etc. are listed in `safe:` above). Same for both package-based
  # (ceph-deploy) upgrade variants below — if anything, MORE reason for
  # explicit approval, since there's no cephadm orchestrator gating them.
  - upgrade_ceph_cluster
  - upgrade_ceph_cluster_package_download
  - upgrade_ceph_cluster_package_local
  # 2026-07-24: same conservative-by-default reasoning as the upgrade
  # action_ids just above — a patch install touches the live cluster (and
  # patch_build_and_stage runs an operator-authored build command sight
  # unseen by this codebase), so both always require explicit approval.
  - patch_build_and_stage
  - patch_install
  # 2026-07-25: same conservative-by-default reasoning — bootstrapping a
  # brand-new cluster runs package installs, MON/MGR/OSD creation, and (for
  # ceph-deploy/rpm-local) real disk formatting, so all 3 install methods
  # always require explicit approval, no exceptions.
  - deploy_cluster_cephadm
  - deploy_cluster_ceph_deploy
  - deploy_cluster_rpm_local
  # 2026-07-26: irreversibly tears down a real, currently-monitored
  # cluster (and, if the operator opts in, wipes OSD disk data) — the
  # single most destructive action_id family in this codebase, always
  # requires explicit approval, no exceptions.
  - delete_cluster_cephadm
  - delete_cluster_manual
  # 2026-07-28: converts every daemon's management style in place on a
  # LIVE cluster (real data, real running VMs on top of it) — always
  # requires explicit approval, no exceptions, same as the rest of this
  # family.
  - convert_cluster_to_cephadm
  # 2026-07-28: unlike delete_pool above (deliberately kept SAFE per an
  # explicit earlier operator request, only for the Chat-with-AI flow's own
  # extra safeguards), rbd_trash_remove PERMANENTLY destroys data with no
  # equivalent per-click safeguard on the Volumes page — conservative
  # default (AD-5) applies here, always requires explicit Dashboard
  # approval.
  - rbd_trash_remove
  # Dedicated Dashboard Block Storage flow. Both mutate live storage and
  # always require preview + explicit approval, even create (capacity impact).
  - rbd_create_volume
  - rbd_resize_volume
  - rbd_rename_volume
  - rbd_trash_move_volume
  - rbd_trash_restore_volume
  # 2026-07-29: writes real (if scratch-only) I/O load to the cluster for
  # several minutes — always requires explicit approval, no exceptions,
  # same conservative default as the rest of this file.
  - volume_perf_sweep
  # Chạy fio read-only trên raw block device từ bên trong VM. Vẫn cần duyệt
  # vì tạo tải thật lên VM/Ceph và có thể ảnh hưởng workload production.
  - vm_perf_benchmark
  # 2026-07-30 (Epic 9, Story 9.1/9.4): restore_rbd_image_to_production
  # (Story 9.4, restores a backup OVER a live production image) and
  # backup_delete_manual (deleting a backup outside the automatic
  # retention schedule) always require explicit approval — conservative
  # default (AD-5), same as the rest of this file. rbd_backup_run/
  # retention_sweep_delete/restore_drill_execute are Safe instead — see
  # the safe: list above for why.
  - restore_rbd_image_to_production
  - backup_delete_manual
  # 2026-08-01 (Story C): moves real data off a live OSD — always requires
  # explicit Dashboard approval, no exceptions, same conservative default as
  # the rest of this file. Deliberately RISKY even though the resulting
  # command is identical to mark_osd_out (SAFE, above) — see
  # device_health_action_ids:'s own comment for why the two are separate
  # action_ids specifically so classification can differ between them.
  - evacuate_predicted_failing_osd
  # 2026-07-31 (Story 9.7): rebuilds a cluster from scratch AND overwrites
  # its RBD data from backup — same conservative-by-default reasoning as
  # every other cluster_deploy_action_ids member above, always requires
  # explicit approval, no exceptions.
  - restore_cluster_from_backup
  # 2026-08-04: stops a real OSD daemon and runs an admin repair-class tool
  # against its on-disk data before restarting it — a historical
  # ceph-bluestore-tool bug could corrupt the repair transaction or OMAP
  # keys under specific conditions (see the command builder's own comment
  # for the exact sources) — always requires explicit Dashboard approval,
  # no exceptions, same conservative default as the rest of this file.
  - bluestore_omap_quick_fix
  # 2026-08-05 (Epic 11, Story 11.3): directly manipulates live mon
  # quorum (`ceph mon rm`/rejoin) — always requires explicit approval, no
  # exceptions, same conservative default as the rest of this file.
  - node_os_gate_prepare
  - node_os_gate_abort
  # 2026-08-05 (Epic 11, Story 11.4): directly manipulates live mon quorum
  # (rejoin) + LVM/OSD data on a freshly-reinstalled node — always requires
  # explicit approval, no exceptions, same conservative default as the rest
  # of this file.
  - node_os_gate_recover

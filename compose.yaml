name: ceph-ai

x-app: &app
  # Production sets CEPH_AI_IMAGE to the scanned registry manifest digest.
  # A local build is explicit: podman build -t ceph-ai:local .
  image: "${CEPH_AI_IMAGE:-ceph-ai:local}"
  working_dir: /app
  env_file: /var/lib/ceph-ai/config/.env
  environment:
    CEPH_AI_ENV_FILE: /var/lib/ceph-ai/config/.env
    CEPH_AI_RUNTIME_DIR: /run/ceph-ai
    CEPH_AI_CONTAINERIZED: "true"
  init: true
  user: "10001:10001"
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=128m
  stop_grace_period: 45s
  restart: unless-stopped
  volumes:
    - /run/ceph-ai:/run/ceph-ai:rw
    - /var/lib/ceph-ai:/var/lib/ceph-ai:rw

# Resource policy for the 8-vCPU host.  The hard CPU caps below total 6.0
# CPUs, leaving at least 2 CPUs for the host OS, Ceph, SSH and short-lived
# maintenance commands.  memswap_limit == mem_limit keeps normal application
# work out of swap even when an optional host swapfile is enabled.

services:
  dashboard-web:
    <<: *app
    cpus: "0.50"
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 256
    command: ["python", "-m", "uvicorn", "dashboard.app:app", "--host", "0.0.0.0", "--port", "8000"]
    ports: ["8000:8000"]
    volumes:
      - /var/lib/ceph-ai:/var/lib/ceph-ai:rw
      # Dashboard is read-only with respect to Ceph.  The full-executor key
      # and token directories are hidden by tmpfs below; only the dedicated
      # read-only identity is mounted into this container.
      - /root/.ssh/id_ed25519:/run/ceph-ai/credentials/readonly/id_ed25519:ro
      # Mount the runtime directory rather than individual heartbeat files.
      # Heartbeats are atomically replaced; a single-file bind mount would
      # keep the old inode and make Dashboard report false stale alerts.
      # The directory contains only bounded heartbeat/lock metadata; the
      # restart socket is over-mounted below with the required write access.
      - /run/ceph-ai:/run/ceph-ai:ro
      - /run/ceph-ai/container-restart.sock:/run/ceph-ai/container-restart.sock
      - /root/.local:/opt/ai-tools:ro
      - /root/.codex/packages:/opt/codex-packages:ro
      # OAuth state is data, not executable application source.
      - ./.codex-account:/app/.codex-account:rw
      - ./.claude-account:/app/.claude-account:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
      - /var/lib/ceph-ai/full-executor-ssh:rw,noexec,nosuid,nodev,size=1m
      - /var/lib/ceph-ai/full-executor-secrets:rw,noexec,nosuid,nodev,size=1m
      - /var/lib/ceph-ai/full-executor-accounts:rw,noexec,nosuid,nodev,size=1m
    environment:
      CEPH_AI_ENV_FILE: /var/lib/ceph-ai/config/.env
      CEPH_AI_RUNTIME_DIR: /run/ceph-ai
      CEPH_AI_CONTAINERIZED: "true"
      SSH_KEY_PATH: /run/ceph-ai/credentials/readonly/id_ed25519
      CEPH_AI_SSH_IDENTITY_ROLE: read-only
      TELEGRAM_LISTENER_ENABLED: "false"
      # The Dashboard's own Settings page (Codex/Claude account login,
      # rate-limit lookup) and web Chatbox spawn these CLIs directly, same
      # as telegram-ai below — without this mount+PATH pair, codex/claude
      # are simply not found in this container.
      PATH: /app/scripts/aiagent-bin:/opt/ai-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/login"]
      interval: 15s
      timeout: 5s
      retries: 4

  telegram-ai:
    <<: *app
    cpus: "0.50"
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    command: ["python", "-m", "worker.telegram_gateway"]
    volumes:
      - /run/ceph-ai:/run/ceph-ai:rw
      - /var/lib/ceph-ai:/var/lib/ceph-ai:rw
      - /root/.ssh/id_ed25519:/run/ceph-ai/credentials/readonly/id_ed25519:ro
      - /var/lib/ceph-ai/full-executor-secrets/token:/run/ceph-ai/credentials/single-full/token:ro
      - /root/.local:/opt/ai-tools:ro
      - /root/.codex/packages:/opt/codex-packages:ro
      # Telegram's login retry flow shares the dedicated OAuth data mounts.
      - ./.codex-account:/app/.codex-account:rw
      - ./.claude-account:/app/.claude-account:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
      - /var/lib/ceph-ai/full-executor-ssh:rw,noexec,nosuid,nodev,size=1m
      - /var/lib/ceph-ai/full-executor-secrets:rw,noexec,nosuid,nodev,size=1m
      - /var/lib/ceph-ai/full-executor-accounts:rw,noexec,nosuid,nodev,size=1m
    environment:
      CEPH_AI_ENV_FILE: /var/lib/ceph-ai/config/.env
      CEPH_AI_RUNTIME_DIR: /run/ceph-ai
      CEPH_AI_CONTAINERIZED: "true"
      SSH_KEY_PATH: /run/ceph-ai/credentials/readonly/id_ed25519
      CEPH_AI_SSH_IDENTITY_ROLE: read-only
      # The dedicated gateway is the sole getUpdates consumer in containers.
      # dashboard-web keeps TELEGRAM_LISTENER_ENABLED=false, so this must be
      # enabled here or Telegram commands are silently never received.
      CEPH_AI_TELEGRAM_POLLING_ENABLED: "true"
      TELEGRAM_LISTENER_ENABLED: "false"
      CEPH_AI_DROP_DUAL_PRIVILEGES: "true"
      CEPH_AI_DUAL_WORKSPACE: /var/lib/ceph-ai/dual-workspace
      PATH: /app/scripts/aiagent-bin:/opt/ai-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      SINGLE_FULL_EXECUTOR_URL: http://full-executor:8787
      SINGLE_FULL_EXECUTOR_TOKEN_FILE: /run/ceph-ai/credentials/single-full/token
    depends_on: [full-executor]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from shared.service_health import status; raise SystemExit(not status('telegram-ai', stale_after_seconds=30)['healthy'])\""]
      interval: 20s
      timeout: 5s
      retries: 3

  full-executor:
    <<: *app
    # AI chat executor budget. Benchmark actions run in a separate child
    # process inside the Worker cgroup and have their own one-CPU limit.
    cpus: "1.00"
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 256
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
    command: ["python", "-m", "uvicorn", "worker.full_executor:app", "--host", "0.0.0.0", "--port", "8787"]
    volumes:
      # The application source is baked into the image. Ceph mutations use
      # the selected cluster's SSH boundary; no live checkout is mounted.
      - /var/lib/ceph-ai:/var/lib/ceph-ai:ro
      - /root/.local:/opt/ai-tools:ro
      - /root/.codex/packages:/opt/codex-packages:ro
      - /var/lib/ceph-ai/full-executor-accounts:/opt/full-executor-accounts:ro
      - /var/lib/ceph-ai/full-executor-ssh/id_ed25519:/tmp/full-executor-id_ed25519:ro
      - /var/lib/ceph-ai/full-executor-ssh/id_ed25519.pub:/tmp/full-executor-id_ed25519.pub:ro
      - /var/lib/ceph-ai/full-executor-secrets/token:/tmp/single-full-executor.token:ro
    environment:
      CEPH_AI_ENV_FILE: /dev/null
      CEPH_AI_RUNTIME_DIR: /tmp/ceph-ai
      CEPH_AI_DUAL_EXECUTION_LOCK_PATH: /tmp/ceph-ai/dual-ai-execution.lock
      CEPH_AI_CONTAINERIZED: "true"
      HOME: /home/aiagent
      PATH: /opt/ai-tools/bin:/opt/codex-packages/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      CODEX_HOME: /opt/full-executor-accounts/codex
      CLAUDE_CONFIG_DIR: /opt/full-executor-accounts/claude
      SSH_KEY_PATH: /tmp/full-executor-id_ed25519
      CEPH_AI_EXECUTOR_SSH_KEY_PATH: /tmp/full-executor-id_ed25519
      SINGLE_FULL_EXECUTOR_TOKEN_FILE: /tmp/single-full-executor.token
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from shared.service_health import status; raise SystemExit(not status('full-executor', stale_after_seconds=30)['healthy'])\" && curl -fsS http://127.0.0.1:8787/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4

  watcher:
    <<: *app
    cpus: "1.50"
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 256
    command: ["python", "-m", "watcher.main"]
    volumes:
      - /run/ceph-ai:/run/ceph-ai:rw
      - /var/lib/ceph-ai:/var/lib/ceph-ai:rw
      - /root/.ssh/id_ed25519:/run/ceph-ai/credentials/readonly/id_ed25519:ro
      # Diagnosis/remediation runs in this service too.  It must see the
      # exact same CLI binaries and account homes as the interactive AI
      # services, otherwise a valid Dashboard/Telegram login is unusable.
      - /root/.local:/opt/ai-tools:ro
      - /root/.codex/packages:/opt/codex-packages:ro
      - ./.codex-account:/app/.codex-account:rw
      - ./.claude-account:/app/.claude-account:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
      - /var/lib/ceph-ai/full-executor-ssh:rw,noexec,nosuid,nodev,size=1m
      - /var/lib/ceph-ai/full-executor-secrets:rw,noexec,nosuid,nodev,size=1m
      - /var/lib/ceph-ai/full-executor-accounts:rw,noexec,nosuid,nodev,size=1m
    environment:
      CEPH_AI_ENV_FILE: /var/lib/ceph-ai/config/.env
      CEPH_AI_RUNTIME_DIR: /run/ceph-ai
      CEPH_AI_CONTAINERIZED: "true"
      SSH_KEY_PATH: /run/ceph-ai/credentials/readonly/id_ed25519
      CEPH_AI_SSH_IDENTITY_ROLE: read-only
      PATH: /app/scripts/aiagent-bin:/opt/ai-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from shared.service_health import status; raise SystemExit(not status('watcher', stale_after_seconds=45)['healthy'])\""]
      interval: 20s
      timeout: 5s
      retries: 3

  vault-monitor:
    <<: *app
    cpus: "0.25"
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128
    command: ["python", "-m", "watcher.vault_monitor"]
    volumes:
      - /var/lib/ceph-ai:/var/lib/ceph-ai:rw
      - /etc/ceph-ai-secrets:/etc/ceph-ai-secrets:ro
    environment:
      CEPH_AI_ENV_FILE: /var/lib/ceph-ai/config/.env
      VAULT_MONITOR_SERVICE: "true"
    restart: unless-stopped

  worker:
    <<: *app
    cpus: "2.00"
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    command: ["python", "-m", "worker.main"]
    volumes:
      - /run/ceph-ai:/run/ceph-ai:rw
      - /var/lib/ceph-ai:/var/lib/ceph-ai:rw
      # The Worker is the typed mutation boundary for normal remediation and
      # therefore receives a separate mutation identity, never the Dashboard
      # read-only key.  Single Full keeps its own identity in full-executor.
      - /var/lib/ceph-ai/full-executor-ssh/id_ed25519:/run/ceph-ai/credentials/mutation/id_ed25519:ro
      # Incident diagnosis executes here, so it needs the same shared
      # Codex/Claude CLI installation and OAuth homes as Dashboard/Telegram.
      - /root/.local:/opt/ai-tools:ro
      - /root/.codex/packages:/opt/codex-packages:ro
      - ./.codex-account:/app/.codex-account:rw
      - ./.claude-account:/app/.claude-account:rw
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=128m
      - /var/lib/ceph-ai/full-executor-ssh:rw,noexec,nosuid,nodev,size=1m
      - /var/lib/ceph-ai/full-executor-secrets:rw,noexec,nosuid,nodev,size=1m
      - /var/lib/ceph-ai/full-executor-accounts:rw,noexec,nosuid,nodev,size=1m
    environment:
      CEPH_AI_ENV_FILE: /var/lib/ceph-ai/config/.env
      CEPH_AI_RUNTIME_DIR: /run/ceph-ai
      CEPH_AI_CONTAINERIZED: "true"
      SSH_KEY_PATH: /run/ceph-ai/credentials/mutation/id_ed25519
      CEPH_AI_SSH_IDENTITY_ROLE: mutation
      PATH: /app/scripts/aiagent-bin:/opt/ai-tools/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from shared.service_health import status; raise SystemExit(not status('worker', stale_after_seconds=45)['healthy'])\""]
      interval: 20s
      timeout: 5s
      retries: 3

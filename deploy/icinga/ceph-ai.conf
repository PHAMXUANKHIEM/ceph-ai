// Ceph checks and the hand-off to Ceph AI (plan icinga-alerting-handoff, I1).
// Managed by deploy/icinga/configure-ceph-ai.sh: edit in the repository, not on the host.
// Clusters are declared in ceph-clusters.conf (generated from /etc/icinga2/ceph/<name>/).

object CheckCommand "ceph-cluster" {
  command = [ PluginDir + "/check_ceph_cluster" ]
  arguments = {
    "check" = { value = "$ceph_check$"; skip_key = true; order = -1 }
    "--conf" = "$ceph_conf$"
    "--keyring" = "$ceph_keyring$"
    "--id" = "$ceph_id$"
    "--warning" = { value = "$ceph_capacity_warning$"; set_if = {{ macro("$ceph_check$") == "capacity" }} }
    "--critical" = { value = "$ceph_capacity_critical$"; set_if = {{ macro("$ceph_check$") == "capacity" }} }
  }
  vars.ceph_id = "icinga"
  vars.ceph_capacity_warning = 75
  vars.ceph_capacity_critical = 85
  timeout = 60s
}

template Host "ceph-cluster" {
  // A cluster is not a machine: its state lives in the services below.
  check_command = "dummy"
  vars.dummy_state = 0
  vars.dummy_text = "Ceph cluster (state in its ceph-* services)"
  check_interval = 5m
}

object HostGroup "ceph-clusters" {
  display_name = "Ceph clusters"
  assign where "ceph-cluster" in host.templates
}

object ServiceGroup "ceph" {
  display_name = "Ceph"
  assign where match("ceph-*", service.name)
}

apply Service "ceph-" for (check in [ "health", "capacity", "osd", "pg", "mon" ]) {
  check_command = "ceph-cluster"
  vars.ceph_check = check
  vars.ceph_conf = host.vars.ceph_conf
  vars.ceph_keyring = host.vars.ceph_keyring
  check_interval = 1m
  retry_interval = 30s
  max_check_attempts = 3   // a HARD state (and a notification) only after 3 failed checks
  assign where "ceph-cluster" in host.templates
}

// --- notifications -------------------------------------------------------------------------

object NotificationCommand "ceph-ai-webhook" {
  command = [ ConfigDir + "/scripts/notify-ceph-ai.sh" ]
  env = {
    NOTIFICATION_TYPE = "$notification.type$"
    HOST = "$host.name$"
    SERVICE = "$service.name$"
    STATE = "$service.state$"
    STATE_TYPE = "$service.state_type$"
    OUTPUT = "$service.output$"
    LONG_OUTPUT = "$service.long_output$"
    LAST_STATE_CHANGE = "$service.last_state_change$"
    AUTHOR = "$notification.author$"
    COMMENT = "$notification.comment$"
  }
}

object NotificationCommand "telegram-service" {
  command = [ ConfigDir + "/scripts/notify-telegram.sh" ]
  env = {
    NOTIFICATION_TYPE = "$notification.type$"
    HOST = "$host.name$"
    SERVICE = "$service.name$"
    STATE = "$service.state$"
    OUTPUT = "$service.output$"
  }
}

object User "ceph-ai" {
  display_name = "Ceph AI webhook"
  states = [ OK, Warning, Critical, Unknown ]
  types = [ Problem, Recovery, Acknowledgement, DowntimeStart, DowntimeEnd, DowntimeRemoved ]
}

object User "telegram-oncall" {
  display_name = "Telegram on-call chat"
  states = [ OK, Warning, Critical, Unknown ]
  types = [ Problem, Recovery, Acknowledgement ]
}

apply Notification "ceph-ai" to Service {
  command = "ceph-ai-webhook"
  users = [ "ceph-ai" ]
  interval = 0          // one event per state change; Ceph AI keeps the incident
  assign where "ceph" in service.groups
}

apply Notification "telegram" to Service {
  command = "telegram-service"
  users = [ "telegram-oncall" ]
  interval = 30m        // reminder while the problem lasts, until acknowledged
  assign where "ceph" in service.groups
}
